apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sync-templates-to-argo-code
  title: Sincronizar Templates com argo-code
  description: Sincroniza os templates do Backstage com o repositório argo-code
  tags:
    - devops-team
    - templates
    - internal
spec:
  owner: group:default/devops-team
  type: scaffold-action
  parameters:
    - title: Configuração de Sincronização
      required: [direction]
      properties:
        direction:
          type: string
          title: Direção
          description: Escolha se deseja fazer pull (do argo-code) ou push (para argo-code)
          enum:
            - pull
            - push
          enumNames:
            - 'Pull: Trazer atualizações do argo-code'
            - 'Push: Enviar mudanças para o argo-code'
        templates:
          type: array
          title: Templates para sincronizar
          description: Deixe vazio para sincronizar todos os templates
          items:
            type: string
            enum:
              - java-service
              - dotnet-service
              - python-service
          uniqueItems: true
        commitMessage:
          type: string
          title: Mensagem de commit (apenas para push)
          description: Mensagem de commit quando fizer push para argo-code
          default: 'chore(templates): atualizar estrutura'

  steps:
    - id: sync
      name: Sincronizar templates
      action: shield:sync:templates
      input:
        direction: ${{ parameters.direction }}
        templates: ${{ parameters.templates || [] }}
        commitMessage: ${{ parameters.commitMessage }}

  output:
    synced: ${{ steps['sync'].output.synced }}
