# Pipeline Azure DevOps para listar App Pools em execucao no IIS da VM Dev.
# Variáveis (definir no Azure DevOps ou passar na fila):
#   VM_HOST     - IP da VM (ex: 10.20.3.5)
#   VM_USER     - usuário Windows (ex: danylo.oliveira@az.local)
#   VM_PASSWORD - senha (definir como secret na pipeline ou variable group)

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: VM_HOST
    value: '10.20.3.5'
  - name: VM_USER
    value: 'danylo.oliveira@az.local'
  - name: VM_PASSWORD
    value: 'Argo@21082025'  # Definir como secret nas variáveis da pipeline ou variable group

steps:
  - script: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq python3-venv python3-pip
      python3 -m venv $(Build.SourcesDirectory)/.venv
      . $(Build.SourcesDirectory)/.venv/bin/activate
      pip install --upgrade pip
      pip install ansible pywinrm requests requests-ntlm
      ansible-galaxy collection install ansible.windows
      python -c "import winrm; import requests; print('winrm ok')"
      ansible --version
    displayName: 'Instalar Ansible + WinRM (venv)'

  - script: |
      mkdir -p $(Build.SourcesDirectory)/.ansible/playbooks
      cat > $(Build.SourcesDirectory)/.ansible/inventory.ini << 'INV'
      [dev]
      $(VM_HOST) ansible_user=$(VM_USER) ansible_password=$(VM_PASSWORD) ansible_connection=winrm ansible_port=5986 ansible_winrm_transport=ntlm ansible_winrm_server_cert_validation=ignore
      INV
      cat $(Build.SourcesDirectory)/.ansible/inventory.ini
    displayName: 'Criar inventario WinRM'
    env:
      VM_HOST: $(VM_HOST)
      VM_USER: $(VM_USER)
      VM_PASSWORD: $(VM_PASSWORD)

  - script: |
      . $(Build.SourcesDirectory)/.venv/bin/activate
      cat > $(Build.SourcesDirectory)/.ansible/playbooks/iis-app-pools.yml << 'PLAYBOOK'
      ---
      - name: Listar pools IIS em execucao
        hosts: all
        gather_facts: false
        tasks:
          - name: Testar conectividade WinRM
            ansible.windows.win_ping:

          - name: Obter pools ativos no IIS
            ansible.windows.win_shell: |
              Import-Module WebAdministration
              Get-ChildItem IIS:\AppPools | ForEach-Object {
                $state = (Get-WebAppPoolState -Name $_.Name).Value
                if ($state -eq 'Started') { $_.Name }
              }
            changed_when: false
            register: iis_pools

          - name: Exibir pools ativos
            ansible.builtin.debug:
              var: iis_pools.stdout_lines
      PLAYBOOK
      ansible-playbook -i $(Build.SourcesDirectory)/.ansible/inventory.ini $(Build.SourcesDirectory)/.ansible/playbooks/iis-app-pools.yml -v
    displayName: 'Executar playbook IIS App Pools (WinRM)'
    env:
      VM_HOST: $(VM_HOST)
      VM_USER: $(VM_USER)
      VM_PASSWORD: $(VM_PASSWORD)
      ANSIBLE_HOST_KEY_CHECKING: 'False'
