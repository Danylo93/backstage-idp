trigger:
  branches:
    include:
      - main
  paths:
    include:
      - templates/*/skeleton/**

pool:
  vmImage: ubuntu-latest

variables:
  ARGO_CODE_URL: 'https://dev.azure.com/argosolutions/Devops/_git/argo-code'
  ARGO_CODE_BRANCH: 'main'

steps:
  - checkout: self
    persistCredentials: true

  - script: |
      git config --global user.name "SHIELD CI"
      git config --global user.email "shield-ci@useargo.com"
    displayName: Configurar Git

  - script: |
      chmod +x ./scripts/sync-templates.sh
      ./scripts/sync-templates.sh init
    displayName: Inicializar sincronização

  - script: |
      ./scripts/sync-templates.sh status
    displayName: Verificar status

  - script: |
      ./scripts/sync-templates.sh push
    condition: ne(variables['Build.Reason'], 'PullRequest')
    displayName: Fazer push para argo-code
    continueOnError: true
    env:
      AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
